spring:
  application:
    name: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true
